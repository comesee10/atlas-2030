<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Профессии·2030</title><meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; script-src 'unsafe-inline'; frame-src 'none'"></head>
<body><script>
(function () {
  var path = location.pathname + location.search;
  var base = '/atlas-2030/';
  if (path.indexOf(base) === 0) path = path.slice(base.length - 1) || '/';
  var allowed = /^\/(?:map|compare|admission|calendar|favorites|quiz|quiz-oge|simulator|professions(?:\/[-a-z0-9]+)?|specialties(?:\/[-a-z0-9]+)?|universities(?:\/[-a-z0-9]+)?|colleges(?:\/[-a-z0-9]+)?|regions|about|methodology|teacher)\/?(?:\?.*)?$/;
  try {
    sessionStorage.setItem('atlas:redirect', allowed.test(path) ? path : '/');
  } catch (e) {
    /* приватный режим или запрет хранилища: переходим без сохранения пути */
  }
  location.replace(base);
}());
</script><p>Переходим к разделу…</p></body></html>
