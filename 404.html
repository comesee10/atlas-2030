<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Профессии·2030</title></head>
<body><script>
(function () {
  var path = location.pathname + location.search;
  var base = '/atlas-2030/';
  if (path.indexOf(base) === 0) path = path.slice(base.length - 1) || '/';
  var allowed = /^\/(?:map|compare|quiz|quiz-oge|professions(?:\/[-a-z0-9]+)?|specialties|universities|colleges(?:\/[-a-z0-9]+)?|regions|about|methodology)(?:\?.*)?$/;
  sessionStorage.setItem('atlas:redirect', allowed.test(path) ? path : '/');
  location.replace(base);
}());
</script><p>Переходим к разделу…</p></body></html>
