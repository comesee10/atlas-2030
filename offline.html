<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нет сети — Профессии·2030</title>
<meta name="theme-color" content="#fbfaf7">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; base-uri 'self'; object-src 'none'; form-action 'none'; script-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-src 'none'">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#fbfaf7;--panel:#fff;--ink:#111312;--ink-2:#3d4341;--ink-3:#6d736f;--accent:#ff4d2e;--rule:#e7e2d8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.55 "Onest","Segoe UI",system-ui,sans-serif}
.card{width:min(560px,100%);padding:32px;border:1px solid var(--rule);border-radius:12px;background:var(--panel);box-shadow:none}
h1{margin:0 0 10px;font-size:clamp(26px,5vw,36px);line-height:1.1}
p{margin:0 0 14px;color:var(--ink-2)}
a{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:10px;background:var(--accent);color:#1a0f0b;font-weight:600;text-decoration:none}
.mono{font-family:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
</style>
</head>
<body>
<main class="card">
  <p class="mono">Профессии·2030 · офлайн</p>
  <h1>Нет подключения к сети</h1>
  <p>Атлас уже сохранён в этом браузере, но эта страница ещё не загружалась. Откройте главную — она работает без интернета.</p>
  <a href="./">Вернуться в атлас</a>
</main>
</body>
</html>
