<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нет сети — Профессии·2030</title>
<meta name="theme-color" content="#091116">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; base-uri 'self'; object-src 'none'; form-action 'none'; script-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-src 'none'">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#091116;--panel:#101d26;--ink:#f3fbfa;--ink-2:#c6d8d8;--ink-3:#839da1;--teal:#5eead4;--rule:#20333e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.55 "Onest","Segoe UI",system-ui,sans-serif;background-image:radial-gradient(700px 400px at 80% -10%,rgba(20,184,166,.16),transparent 70%)}
.card{width:min(560px,100%);padding:32px;border:1px solid var(--rule);border-radius:16px;background:var(--panel);box-shadow:0 30px 80px rgba(0,0,0,.45)}
h1{margin:0 0 10px;font-size:clamp(26px,5vw,36px);line-height:1.1}
p{margin:0 0 14px;color:var(--ink-2)}
a{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:9px;background:linear-gradient(135deg,#5eead4,#14b8a6);color:#06201d;font-weight:600;text-decoration:none}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
</style>
</head>
<body>
<main class="card">
  <p class="mono">Профессии·2030 · офлайн</p>
  <h1>Нет подключения к сети</h1>
  <p>Атлас уже сохранён в этом браузере, но эта страница ещё не загружалась. Откройте главную — она работает без интернета.</p>
  <a href="./">Вернуться в атлас</a>
</main>
</body>
</html>
